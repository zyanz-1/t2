<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timemark Camera Studio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS for OpenStreetMap -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Turf.js — Point-in-Polygon untuk lookup kecamatan dari GeoJSON lokal (gratis, offline) -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <!-- Google Fonts for Timemark Condensed Style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; }
    .font-condensed { font-family: 'Roboto Condensed', sans-serif; }
    #map { height: 220px; width: 100%; border-radius: 0.5rem; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Header / Top Bar -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2">
      <span class="text-amber-500 font-bold text-lg font-condensed tracking-wide flex items-center gap-1.5">
        <svg viewBox="0 0 24 24" class="w-5 h-5 text-amber-500 fill-current"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        Timemark Camera Studio
      </span>
    </div>

    <!-- Export Controls -->
    <div class="flex items-center gap-2">
      <select id="exportFormat" class="bg-slate-950 border border-slate-700 text-slate-300 rounded-lg text-xs px-2.5 py-2 focus:ring-1 focus:ring-amber-500 outline-none">
        <option value="jpeg-85">JPG (Standar ~ 400KB)</option>
        <option value="jpeg-95">JPG (Kualitas Tinggi ~ 900KB)</option>
        <option value="png">PNG (Tanpa Kompresi ~ 4MB)</option>
      </select>
      <button onclick="downloadImage()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-semibold px-4 py-2 rounded-lg text-xs shadow-md shadow-amber-500/10 flex items-center justify-center gap-2 transition active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Unduh Photo
      </button>
    </div>
  </header>

  <!-- Mobile Tab View Switcher -->
  <div class="flex md:hidden border-b border-slate-800 bg-slate-900 text-xs font-medium">
    <button id="tabControlsBtn" onclick="switchMobileTab('controls')" class="flex-1 py-2.5 text-center text-amber-500 border-b-2 border-amber-500">Kontrol Edit</button>
    <button id="tabPreviewBtn" onclick="switchMobileTab('preview')" class="flex-1 py-2.5 text-center text-slate-400">Pratinjau Foto</button>
  </div>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
    
    <!-- Left Sidebar / Edit Controls -->
    <section id="panelControls" class="w-full md:w-96 bg-slate-900/60 border-r border-slate-800 overflow-y-auto p-4 flex flex-col gap-4">
      
      <!-- Image Upload Block -->
      <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-800">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">1. Pilih Foto</label>
        <input type="file" id="imageInput" accept="image/*" class="block w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-amber-500 hover:file:bg-slate-700 cursor-pointer" />
      </div>

      <!-- Date & Time Settings -->
      <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-800 flex flex-col gap-3">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">2. Tanggal & Waktu</label>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Jam (HH:MM)</label>
            <input type="time" id="inputTime" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 outline-none focus:border-amber-500" />
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Tanggal</label>
            <input type="date" id="inputDate" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 outline-none focus:border-amber-500" />
          </div>
        </div>
        <div>
          <label class="text-[10px] text-slate-400 block mb-1">Hari (Otomatis)</label>
          <input type="text" id="inputDay" readonly class="w-full bg-slate-950/60 border border-slate-800/80 rounded-lg px-2.5 py-1.5 text-xs text-amber-400 font-medium outline-none cursor-not-allowed" />
        </div>
      </div>

      <!-- Map & Location Picker Settings -->
      <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-800 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">3. Lokasi Peta</label>
          <button onclick="locateUser()" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-amber-500 px-2 py-1 rounded transition flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Deteksi Lokasi
          </button>
        </div>

        <!-- Leaflet Map Container -->
        <div id="map"></div>
        <!-- Status GeoJSON Loading -->
        <p id="geoStatusMsg" class="text-[10px] text-amber-400 italic min-h-[14px]"></p>

        <!-- Address Separated Inputs -->
        <div class="grid grid-cols-2 gap-2 mt-1">
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Desa / Kelurahan</label>
            <input type="text" id="inputDesa" value="Hamalau" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 outline-none focus:border-amber-500" />
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Kecamatan</label>
            <input type="text" id="inputKecamatan" value="Kec. Sungai Raya" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 outline-none focus:border-amber-500" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Kabupaten / Kota</label>
            <input type="text" id="inputKabupaten" value="Kabupaten Hulu Sungai Selatan" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 outline-none focus:border-amber-500" />
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Provinsi</label>
            <input type="text" id="inputProvinsi" value="Kalimantan Selatan" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 outline-none focus:border-amber-500" />
          </div>
        </div>

        <!-- Coordinates Input Section -->
        <div class="border-t border-slate-800 pt-2 flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <label class="text-[10px] text-slate-400 uppercase font-semibold">Mode Koordinat</label>
            <div class="flex gap-1 text-[10px]">
              <button id="btnModeAuto" onclick="setCoordMode('auto')" class="px-2 py-0.5 rounded bg-amber-500 text-slate-950 font-semibold">Sync Peta</button>
              <button id="btnModeManual" onclick="setCoordMode('manual')" class="px-2 py-0.5 rounded bg-slate-800 text-slate-400">Manual Lat/Lng</button>
            </div>
          </div>

          <!-- Direct Custom String Input (Default Auto Mode) -->
          <div id="coordAutoBox">
            <label class="text-[10px] text-slate-400 block mb-1">Format Tampilan Koordinat</label>
            <input type="text" id="inputCoords" value="2.808035°S, 115.261611°E" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 outline-none focus:border-amber-500" />
          </div>

          <!-- Manual Latitude & Longitude Input Fields -->
          <div id="coordManualBox" class="hidden grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">Latitude (misal: -2.808035)</label>
              <input type="number" step="any" id="inputManualLat" placeholder="-2.808035" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 outline-none focus:border-amber-500" />
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">Longitude (misal: 115.261611)</label>
              <input type="number" step="any" id="inputManualLng" placeholder="115.261611" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 outline-none focus:border-amber-500" />
            </div>
            <button onclick="applyManualCoords()" class="col-span-2 bg-slate-800 hover:bg-slate-700 text-amber-500 text-xs py-1.5 rounded-lg border border-slate-700 font-semibold transition">
              Terapkan Koordinat & Update Peta
            </button>
          </div>
        </div>
      </div>

      <!-- Watermark & Security Code Settings -->
      <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-800 flex flex-col gap-3">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">4. Watermark & Kode</label>
        
        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-300">Logo Atas Kanan</span>
          <input type="checkbox" id="showLogo" checked class="accent-amber-500 cursor-pointer" />
        </div>

        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-300">Kode Verifikasi Samping Kanan</span>
          <input type="checkbox" id="showCode" checked class="accent-amber-500 cursor-pointer" />
        </div>

        <div class="flex items-center gap-2">
          <input type="text" id="inputCode" value="AP9NCLR964XCB3" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 outline-none focus:border-amber-500" />
          <button onclick="generateRandomCode()" class="bg-slate-800 hover:bg-slate-700 text-amber-500 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 transition">Acak</button>
        </div>
      </div>

    </section>

    <!-- Right Area / Canvas Preview -->
    <section id="panelPreview" class="hidden md:flex flex-1 bg-slate-950 p-4 justify-center items-center overflow-auto relative">
      <div class="relative max-w-full max-h-full flex items-center justify-center border border-slate-800 rounded-xl overflow-hidden bg-slate-900 shadow-2xl">
        <canvas id="photoCanvas" class="max-w-full max-h-[82vh] object-contain"></canvas>
      </div>
    </section>

  </main>

  <!-- Application Logic JavaScript -->
  <script>
    let canvas, ctx;
    let baseImage = null;
    let map, marker;
    let coordMode = 'auto';
    let originalFileName = 'photo';

    // ─── Cache GeoJSON per provinsi agar tidak re-download setiap klik ───
    const geoJsonCache = {};
    // Promise in-flight per provinsi agar tidak double-fetch & bebas race condition
    const geoJsonPromises = {};
    // ID request terbaru untuk mencegah hasil klik lama menimpa klik baru
    let latestGeocodeRequestId = 0;

    // Mapping nama provinsi (lowercase) ke kode file di repo JfrAziz/indonesia-district
    // Sumber data: data batas wilayah resmi Indonesia, gratis & open source
    // CDN: jsDelivr → GitHub (tidak ada biaya, tidak ada API key, tidak bisa di-abuse)
    const PROVINCE_CODE_MAP = {
      'aceh': 'aceh', 'sumatera utara': 'sumatera-utara', 'sumatera barat': 'sumatera-barat',
      'riau': 'riau', 'kepulauan riau': 'kepulauan-riau', 'jambi': 'jambi',
      'sumatera selatan': 'sumatera-selatan', 'kepulauan bangka belitung': 'bangka-belitung',
      'bengkulu': 'bengkulu', 'lampung': 'lampung', 'dki jakarta': 'dki-jakarta',
      'jawa barat': 'jawa-barat', 'banten': 'banten', 'jawa tengah': 'jawa-tengah',
      'di yogyakarta': 'di-yogyakarta', 'jawa timur': 'jawa-timur', 'bali': 'bali',
      'nusa tenggara barat': 'nusa-tenggara-barat', 'nusa tenggara timur': 'nusa-tenggara-timur',
      'kalimantan barat': 'kalimantan-barat', 'kalimantan tengah': 'kalimantan-tengah',
      'kalimantan selatan': 'kalimantan-selatan', 'kalimantan timur': 'kalimantan-timur',
      'kalimantan utara': 'kalimantan-utara', 'sulawesi utara': 'sulawesi-utara',
      'gorontalo': 'gorontalo', 'sulawesi tengah': 'sulawesi-tengah',
      'sulawesi barat': 'sulawesi-barat', 'sulawesi selatan': 'sulawesi-selatan',
      'sulawesi tenggara': 'sulawesi-tenggara', 'maluku': 'maluku',
      'maluku utara': 'maluku-utara', 'papua barat': 'papua-barat', 'papua': 'papua'
    };

    // Default Coordinates
    const defaultLat = -2.808035;
    const defaultLng = 115.261611;

    // Dictionary Pemetaan Provinsi Bahasa Inggris ke Bahasa Indonesia
    const provinceTranslationMap = {
      'South Kalimantan': 'Kalimantan Selatan',
      'East Kalimantan': 'Kalimantan Timur',
      'West Kalimantan': 'Kalimantan Barat',
      'Central Kalimantan': 'Kalimantan Tengah',
      'North Kalimantan': 'Kalimantan Utara',
      'Special Region of Yogyakarta': 'DI Yogyakarta',
      'Yogyakarta': 'DI Yogyakarta',
      'Jakarta': 'DKI Jakarta',
      'Special Capital Region of Jakarta': 'DKI Jakarta',
      'West Java': 'Jawa Barat',
      'Central Java': 'Jawa Tengah',
      'East Java': 'Jawa Timur',
      'West Sumatra': 'Sumatera Barat',
      'North Sumatra': 'Sumatera Utara',
      'South Sumatra': 'Sumatera Selatan',
      'West Nusa Tenggara': 'Nusa Tenggara Barat',
      'East Nusa Tenggara': 'Nusa Tenggara Timur',
      'South Sulawesi': 'Sulawesi Selatan',
      'North Sulawesi': 'Sulawesi Utara',
      'Central Sulawesi': 'Sulawesi Tengah',
      'Southeast Sulawesi': 'Sulawesi Tenggara',
      'West Sulawesi': 'Sulawesi Barat'
    };

    window.addEventListener('load', () => {
      canvas = document.getElementById('photoCanvas');
      ctx = canvas.getContext('2d');

      const now = new Date();
      document.getElementById('inputTime').value = now.toTimeString().substring(0, 5);
      
      const todayStr = now.toISOString().substring(0, 10);
      document.getElementById('inputDate').value = todayStr;
      
      updateDayFromDate(todayStr);

      initMap();
      bindEvents();
      loadDefaultPlaceholder();
    });

    function translateProvince(provName) {
      if (!provName) return 'Kalimantan Selatan';
      return provinceTranslationMap[provName] || provName;
    }

    function getIndonesianDayName(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString + 'T00:00:00');
      const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      return days[date.getDay()];
    }

    function updateDayFromDate(dateStr) {
      const dayName = getIndonesianDayName(dateStr);
      document.getElementById('inputDay').value = dayName;
    }

    function initMap() {
      map = L.map('map').setView([defaultLat, defaultLng], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);

      map.on('click', (e) => {
        const { lat, lng } = e.latlng;
        marker.setLatLng([lat, lng]);
        updateCoordsFromLatLng(lat, lng);
        reverseGeocode(lat, lng);
      });

      marker.on('dragend', () => {
        const position = marker.getLatLng();
        updateCoordsFromLatLng(position.lat, position.lng);
        reverseGeocode(position.lat, position.lng);
      });
    }

    function setCoordMode(mode) {
      coordMode = mode;
      const autoBox = document.getElementById('coordAutoBox');
      const manualBox = document.getElementById('coordManualBox');
      const btnAuto = document.getElementById('btnModeAuto');
      const btnManual = document.getElementById('btnModeManual');

      if (mode === 'manual') {
        autoBox.classList.add('hidden');
        manualBox.classList.remove('hidden');
        btnManual.className = 'px-2 py-0.5 rounded bg-amber-500 text-slate-950 font-semibold';
        btnAuto.className = 'px-2 py-0.5 rounded bg-slate-800 text-slate-400';
      } else {
        autoBox.classList.remove('hidden');
        manualBox.classList.add('hidden');
        btnAuto.className = 'px-2 py-0.5 rounded bg-amber-500 text-slate-950 font-semibold';
        btnManual.className = 'px-2 py-0.5 rounded bg-slate-800 text-slate-400';
      }
    }

    function applyManualCoords() {
      const lat = parseFloat(document.getElementById('inputManualLat').value);
      const lng = parseFloat(document.getElementById('inputManualLng').value);

      if (isNaN(lat) || isNaN(lng)) {
        alert("Silakan masukkan nilai koordinat latitude dan longitude yang valid.");
        return;
      }

      map.setView([lat, lng], 15);
      marker.setLatLng([lat, lng]);
      updateCoordsFromLatLng(lat, lng);
      reverseGeocode(lat, lng);
    }

    function locateUser() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          map.setView([lat, lng], 15);
          marker.setLatLng([lat, lng]);
          updateCoordsFromLatLng(lat, lng);
          reverseGeocode(lat, lng);
        }, () => {
          alert("Izin lokasi ditolak atau tidak tersedia.");
        });
      }
    }

    function updateCoordsFromLatLng(lat, lng) {
      const latDir = lat < 0 ? 'S' : 'N';
      const lngDir = lng < 0 ? 'W' : 'E';
      const coordStr = `${Math.abs(lat).toFixed(6)}°${latDir}, ${Math.abs(lng).toFixed(6)}°${lngDir}`;
      document.getElementById('inputCoords').value = coordStr;

      document.getElementById('inputManualLat').value = lat;
      document.getElementById('inputManualLng').value = lng;

      updateCanvas();
    }

    // ═══════════════════════════════════════════════════════════════════
    // GEOCODING — 3-layer cascade (gratis, tanpa API key, tidak bisa di-abuse)
    //   Layer 1: BigDataCloud  → Provinsi, Kabupaten, Desa (cepat & andal)
    //   Layer 2: Turf.js + GeoJSON HDX/OCHA → Kecamatan (akurat, data resmi Indonesia)
    //   Layer 3: Nominatim OSM → fallback terakhir
    // ═══════════════════════════════════════════════════════════════════

    // Helper: cek apakah nama kecamatan valid (tidak sama persis dengan nama kabupaten/kota)
    function isKecamatanValid(kecName, kabName) {
      if (!kecName) return false;
      const kec = kecName.toLowerCase().replace(/^(kecamatan|kec\.?|kabupaten|kota)\s*/i, '').trim();
      const kab = (kabName || '').toLowerCase().replace(/^(kabupaten|kota)\s*/i, '').trim();
      if (!kec) return false;
      if (!kab) return true;
      // Hanya tolak jika sama persis setelah normalisasi prefix
      return kec !== kab;
    }

    function reverseGeocode(lat, lng) {
      const reqId = ++latestGeocodeRequestId;
      fetchBigDataCloud(lat, lng, reqId);
    }

    // ─── Layer 1: BigDataCloud untuk Provinsi, Kabupaten & Desa ───
    function fetchBigDataCloud(lat, lng, reqId) {
      fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=id`)
        .then(res => res.json())
        .then(data => {
          if (reqId !== latestGeocodeRequestId) return;

          const admins = (data.localityInfo && data.localityInfo.administrative) || [];
          const lvl4   = admins.find(a => a.adminLevel === 4);
          const lvl5   = admins.find(a => a.adminLevel === 5);
          const lvlKec = admins.find(a => a.adminLevel === 6)
                      || admins.find(a => a.adminLevel === 8)
                      || admins.find(a => a.adminLevel === 10);
          const lvlDesa = admins.filter(a => a.adminLevel > 6 && a.adminLevel !== (lvlKec?.adminLevel))
                                .sort((a, b) => b.adminLevel - a.adminLevel)[0];

          const prov = lvl4    ? translateProvince(lvl4.name)  : translateProvince(data.principalSubdivision || '');
          const kab  = lvl5    ? lvl5.name                     : (data.city || '');
          const desa = lvlDesa ? lvlDesa.name                  : (data.locality || '');

          // Kecamatan dari BigDataCloud: validasi dulu, tolak jika = kabupaten
          let kec = '';
          if (lvlKec) {
            const rawKec = lvlKec.name.replace(/^(kecamatan|kec\.?)\s*/i, '').trim();
            if (isKecamatanValid(`Kec. ${rawKec}`, kab)) kec = `Kec. ${rawKec}`;
          }

          if (prov) document.getElementById('inputProvinsi').value  = prov;
          if (kab)  document.getElementById('inputKabupaten').value = kab;
          if (desa) document.getElementById('inputDesa').value      = desa;
          // Update kecamatan (kosongkan dulu jika belum dapat agar tidak nyangkut nilai titik lama)
          document.getElementById('inputKecamatan').value = kec;
          updateCanvas();

          // Perkuat kecamatan via GeoJSON (paralel — override jika ketemu)
          if (prov) {
            lookupKecamatanGeoJSON(lat, lng, prov, kab, reqId);
          } else if (!kec) {
            fetchNominatim(lat, lng, true, reqId);
          }
        })
        .catch(() => {
          if (reqId === latestGeocodeRequestId) fetchNominatim(lat, lng, false, reqId);
        });
    }

    // ─── Layer 2: Turf.js Point-in-Polygon dengan GeoJSON kecamatan Indonesia ───
    // Sumber: HDX/OCHA Indonesia Admin Boundaries (data resmi, gratis, open source)
    // CDN: jsDelivr → GitHub. Tanpa API key, tanpa biaya, tidak mungkin di-abuse.
    function lookupKecamatanGeoJSON(lat, lng, provName, kabName, reqId) {
      const provKey  = provName.toLowerCase().trim();
      const fileSlug = PROVINCE_CODE_MAP[provKey];
      if (!fileSlug) {
        if (!document.getElementById('inputKecamatan').value) {
          fetchNominatim(lat, lng, true, reqId);
        }
        return;
      }

      // Sudah ada di cache → langsung pakai
      if (geoJsonCache[fileSlug]) {
        if (reqId !== latestGeocodeRequestId) return;
        const matched = applyTurfLookup(lat, lng, geoJsonCache[fileSlug], kabName);
        if (!matched && !document.getElementById('inputKecamatan').value) {
          fetchNominatim(lat, lng, true, reqId);
        }
        return;
      }

      // Belum ada di cache → gunakan promise yang sama jika sedang loading
      if (!geoJsonPromises[fileSlug]) {
        setGeoStatus('⏳ Memuat data kecamatan...');
        const url = `https://cdn.jsdelivr.net/gh/JfrAziz/indonesia-district@master/geojson/district/${fileSlug}.geojson`;
        geoJsonPromises[fileSlug] = fetch(url)
          .then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          })
          .then(gj => {
            geoJsonCache[fileSlug] = gj;
            setGeoStatus('');
            return gj;
          })
          .catch(err => {
            delete geoJsonPromises[fileSlug];
            setGeoStatus('');
            throw err;
          });
      }

      geoJsonPromises[fileSlug]
        .then(gj => {
          if (reqId !== latestGeocodeRequestId) return;
          const matched = applyTurfLookup(lat, lng, gj, kabName);
          if (!matched && !document.getElementById('inputKecamatan').value) {
            fetchNominatim(lat, lng, true, reqId);
          }
        })
        .catch(() => {
          if (reqId === latestGeocodeRequestId && !document.getElementById('inputKecamatan').value) {
            fetchNominatim(lat, lng, true, reqId);
          }
        });
    }

    function applyTurfLookup(lat, lng, geojson, kabName) {
      try {
        const pt = turf.point([lng, lat]);
        let found = null;
        for (const feature of geojson.features) {
          if (turf.booleanPointInPolygon(pt, feature)) {
            found = feature.properties;
            break;
          }
        }
        if (!found) return false;

        // Skema HDX/OCHA: ADM3_EN / ADM3_ID = Kecamatan, ADM4_EN / ADM4_ID = Desa
        // Fallback ke skema alternatif jika tidak ada
        const kecRaw  = found.ADM3_EN || found.ADM3_ID || found.KECAMATAN || found.kecamatan || found.NAME_3 || '';
        const desaRaw = found.ADM4_EN || found.ADM4_ID || found.DESA || found.desa || found.NAME_4 || '';

        let updated = false;
        if (kecRaw) {
          const kecClean = kecRaw.replace(/^(kecamatan|kec\.?)\s*/i, '').trim();
          const kecFull  = `Kec. ${kecClean}`;
          // Hanya update jika lolos validasi (bukan nama kabupaten)
          if (isKecamatanValid(kecFull, kabName || '')) {
            document.getElementById('inputKecamatan').value = kecFull;
            updated = true;
          }
        }
        if (desaRaw && !document.getElementById('inputDesa').value) {
          document.getElementById('inputDesa').value = desaRaw;
        }
        if (updated || desaRaw) updateCanvas();
        return updated;
      } catch (e) {
        return false;
      }
    }

    // ─── Layer 3: Nominatim (fallback terakhir) ───
    function fetchNominatim(lat, lng, kecOnly = false, reqId = latestGeocodeRequestId) {
      fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=id&addressdetails=1`)
        .then(res => res.json())
        .then(data => {
          if (reqId !== latestGeocodeRequestId) return;
          if (data && data.address) {
            const addr = data.address;
            const desa = addr.village || addr.quarter || addr.neighbourhood || addr.suburb || addr.hamlet || '';
            let rawKec = addr.county || addr.subdistrict || addr.municipality || addr.district || addr.town || '';
            let kec = '';
            if (rawKec) {
              rawKec = rawKec.replace(/^(kecamatan|kec\.?)\s*/i, '').trim();
              kec = `Kec. ${rawKec}`;
            }
            if (!kecOnly) {
              const kab  = addr.state_district || addr.regency || addr.city || '';
              const prov = translateProvince(addr.state || '');
              if (kab)  document.getElementById('inputKabupaten').value = kab;
              if (prov) document.getElementById('inputProvinsi').value  = prov;
            }
            const kabCurrent = document.getElementById('inputKabupaten').value || '';
            if (desa && (!kecOnly || !document.getElementById('inputDesa').value)) {
              document.getElementById('inputDesa').value = desa;
            }
            if (kec && isKecamatanValid(kec, kabCurrent)) {
              document.getElementById('inputKecamatan').value = kec;
            }
            updateCanvas();
          }
        }).catch(() => {});
    }

    // ─── Helper: tampilkan status loading GeoJSON ───
    function setGeoStatus(msg) {
      const el = document.getElementById('geoStatusMsg');
      if (el) el.textContent = msg;
    }

    function generateRandomCode() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let code = '';
      for (let i = 0; i < 14; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById('inputCode').value = code;
      updateCanvas();
    }

    function bindEvents() {
      document.getElementById('inputDate').addEventListener('change', (e) => {
        updateDayFromDate(e.target.value);
        updateCanvas();
      });

      const inputs = ['inputTime', 'inputDesa', 'inputKecamatan', 'inputKabupaten', 'inputProvinsi', 'inputCoords', 'inputCode', 'showLogo', 'showCode'];
      inputs.forEach(id => {
        document.getElementById(id).addEventListener('input', updateCanvas);
        document.getElementById(id).addEventListener('change', updateCanvas);
      });

      document.getElementById('imageInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          originalFileName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;

          generateRandomCode(); // Auto-generate kode baru setiap foto diupload

          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              baseImage = img;
              updateCanvas();
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      });
    }

    function loadDefaultPlaceholder() {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        baseImage = img;
        updateCanvas();
      };
      img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><rect width="100%" height="100%" fill="%234A90E2"/><path d="M0,0 L1080,1440" stroke="%2367A4EC" stroke-width="120"/><circle cx="500" cy="500" r="350" fill="%233B82D6" opacity="0.4"/></svg>';
    }

    function updateCanvas() {
      if (!baseImage) return;

      canvas.width = baseImage.width;
      canvas.height = baseImage.height;
      ctx.drawImage(baseImage, 0, 0);

      const scale = Math.max(canvas.width, canvas.height) / 1000;

      // 1. TOP-RIGHT LOGO
      if (document.getElementById('showLogo').checked) {
        ctx.save();
        const logoMarginRight = 45 * scale;
        const logoMarginTop = 45 * scale;
        
        ctx.textAlign = 'right';
        ctx.textBaseline = 'top';

        const timeText = "Time";
        const markText = "mark";

        ctx.font = `bold ${32 * scale}px 'Roboto', sans-serif`;
        const timeWidth = ctx.measureText(timeText).width;
        const markWidth = ctx.measureText(markText).width;

        const startX = canvas.width - logoMarginRight;

        ctx.fillStyle = '#FFFFFF';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 4 * scale;
        ctx.fillText(markText, startX, logoMarginTop);

        ctx.fillStyle = '#F59E0B';
        ctx.fillText(timeText, startX - markWidth, logoMarginTop);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.font = `${16 * scale}px 'Roboto', sans-serif`;
        ctx.fillText("Foto 100% akurat", startX, logoMarginTop + (38 * scale));

        ctx.restore();
      }

      // 2. MIDDLE-RIGHT VERTICAL SECURITY CODE
      if (document.getElementById('showCode').checked) {
        ctx.save();
        const codeText = document.getElementById('inputCode').value || 'AP9NCLR964XCB3';
        const fullSecText = `🛡 ${codeText}  Timemark Verified`;
        
        ctx.font = `${13 * scale}px 'Roboto', sans-serif`;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        
        ctx.translate(canvas.width - (18 * scale), canvas.height / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 3 * scale;
        ctx.fillText(fullSecText, 0, 0);
        ctx.restore();
      }

      // 3. BOTTOM-LEFT TIMEMARK OVERLAY
      ctx.save();
      const paddingLeft = 40 * scale;
      const paddingBottom = 45 * scale;

      const timeVal = document.getElementById('inputTime').value || '06:18';
      const dateRaw = document.getElementById('inputDate').value;
      const dayVal = document.getElementById('inputDay').value || getIndonesianDayName(dateRaw);

      let formattedDate = '01 November 2026';
      if (dateRaw) {
        const d = new Date(dateRaw + 'T00:00:00');
        const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        formattedDate = `${String(d.getDate()).padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
      }

      const desaVal = document.getElementById('inputDesa').value || '';
      const kecVal = document.getElementById('inputKecamatan').value || '';
      const kabVal = document.getElementById('inputKabupaten').value || '';
      const provVal = translateProvince(document.getElementById('inputProvinsi').value || '');
      const coordsVal = document.getElementById('inputCoords').value || '2.808035°S, 115.261611°E';

      const addrRow1 = [desaVal, kecVal].filter(Boolean).join(', ');
      const addrRow2 = [kabVal, provVal].filter(Boolean).join(', ');

      let currentY = canvas.height - paddingBottom;

      // Draw Koordinat line with Soft Faded Background
      ctx.font = `${20 * scale}px 'Roboto', sans-serif`;
      const coordText = `Koordinat: ${coordsVal}`;
      const textMetrics = ctx.measureText(coordText);
      
      const pillHeight = 36 * scale;
      const pillWidth = textMetrics.width + (30 * scale);
      const pillX = paddingLeft - (10 * scale);
      const pillY = currentY - ( pillHeight * 0.75 );

      const gradient = ctx.createLinearGradient(pillX, 0, pillX + pillWidth, 0);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 0.28)');
      gradient.addColorStop(0.75, 'rgba(255, 255, 255, 0.18)');
      gradient.addColorStop(1, 'rgba(255, 255, 255, 0.0)');

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.roundRect(pillX, pillY, pillWidth, pillHeight, 6 * scale);
      ctx.fill();

      ctx.fillStyle = '#FFFFFF';
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 3 * scale;
      ctx.fillText(coordText, paddingLeft, currentY);

      currentY -= 36 * scale;

      if (addrRow2) {
        ctx.font = `${24 * scale}px 'Roboto', sans-serif`;
        ctx.fillText(addrRow2, paddingLeft, currentY);
        currentY -= 32 * scale;
      }

      if (addrRow1) {
        ctx.font = `${24 * scale}px 'Roboto', sans-serif`;
        ctx.fillText(addrRow1, paddingLeft, currentY);
        currentY -= 45 * scale;
      }

      const clockFontSize = 82 * scale;
      ctx.font = `condensed 300 ${clockFontSize}px 'Roboto Condensed', sans-serif`;
      
      const timeWidth = ctx.measureText(timeVal).width;

      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(timeVal, paddingLeft, currentY);

      const barX = paddingLeft + timeWidth + (16 * scale);
      const barHeight = 65 * scale;
      const barY = currentY - barHeight + (10 * scale);

      ctx.fillStyle = '#F59E0B';
      ctx.fillRect(barX, barY, 4 * scale, barHeight);

      const dateX = barX + (16 * scale);
      ctx.font = `${20 * scale}px 'Roboto', sans-serif`;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(formattedDate, dateX, currentY - (36 * scale));
      ctx.fillText(dayVal, dateX, currentY - (6 * scale));

      ctx.restore();
    }

    function switchMobileTab(tab) {
      const controls = document.getElementById('panelControls');
      const preview = document.getElementById('panelPreview');
      const tabControlsBtn = document.getElementById('tabControlsBtn');
      const tabPreviewBtn = document.getElementById('tabPreviewBtn');

      if (tab === 'controls') {
        controls.classList.remove('hidden');
        preview.classList.add('hidden');
        tabControlsBtn.className = 'flex-1 py-2.5 text-center text-amber-500 border-b-2 border-amber-500';
        tabPreviewBtn.className = 'flex-1 py-2.5 text-center text-slate-400';
      } else {
        controls.classList.add('hidden');
        preview.classList.remove('hidden');
        preview.classList.add('flex');
        tabControlsBtn.className = 'flex-1 py-2.5 text-center text-slate-400';
        tabPreviewBtn.className = 'flex-1 py-2.5 text-center text-amber-500 border-b-2 border-amber-500';
      }
    }

    function downloadImage() {
      const formatChoice = document.getElementById('exportFormat').value;
      let mimeType = 'image/jpeg';
      let quality = 0.85;
      let ext = 'jpg';

      if (formatChoice === 'jpeg-95') {
        quality = 0.95;
      } else if (formatChoice === 'png') {
        mimeType = 'image/png';
        ext = 'png';
      }

      const link = document.createElement('a');
      link.download = `${originalFileName}-timestamp.${ext}`;
      link.href = canvas.toDataURL(mimeType, quality);
      link.click();
    }
  </script>
